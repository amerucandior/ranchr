spring:
  application:
    name: ranchr

  # Database Configuration (Defaults to local H2, overridable by environment variables)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sampledb}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

  # Mail Configuration (Spring Mail for EmailService)
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:your-email@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # RabbitMQ Configuration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:myuser}
    password: ${SPRING_RABBITMQ_PASSWORD:secret}

# Security & JWT Configuration
security:
  jwt:
    secret-key: ${SECURITY_JWT_SECRET_KEY:your-base64-or-strong-secret-key-at-least-256-bits-long}
    access-token-expiry: ${SECURITY_JWT_ACCESS_TOKEN_EXPIRY:900000}     # 15 minutes in milliseconds
    refresh-token-expiry: ${SECURITY_JWT_REFRESH_TOKEN_EXPIRY:604800000} # 7 days in milliseconds

# Third-Party Integrations
app:
  cloudinary:
    cloud-name: ${APP_CLOUDINARY_CLOUD_NAME:your-cloudinary-cloud-name}
    api-key: ${APP_CLOUDINARY_API_KEY:your-cloudinary-api-key}
    api-secret: ${APP_CLOUDINARY_API_SECRET:your-cloudinary-api-secret}
    api-base-url: ${APP_CLOUDINARY_API_BASE_URL:https://api.cloudinary.com}

africastalking:
  username: ${AFRICASTALKING_USERNAME:your-africastalking-username}
  api-key: ${AFRICASTALKING_API_KEY:your-africastalking-api-key}
  sender-id: ${AFRICASTALKING_SENDER_ID:your-africastalking-sender-id}

# Actuator & Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: Ranchr
    version: 0.0.1
    description: Ranchr API

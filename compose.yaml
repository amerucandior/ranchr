services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=ranchr_db'
      - 'POSTGRES_PASSWORD=finance'
      - 'POSTGRES_USER=Pass'
    ports:
      - '5432'
  rabbitmq:
    image: 'rabbitmq:latest'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=myuser'
    ports:
      - '5672'
  redis:
    image: 'redis:latest'
    ports:
      - '6379'

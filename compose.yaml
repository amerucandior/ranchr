services:
  postgres:
    image: 'docker.io/library/postgres:16-alpine'
    container_name: ranchr-postgres
    environment:
      - 'POSTGRES_DB=ranchr_db'
      - 'POSTGRES_USER=Pass'
      - 'POSTGRES_PASSWORD=finance'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U Pass -d ranchr_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: 'docker.io/library/rabbitmq:3-management-alpine'
    container_name: ranchr-rabbitmq
    environment:
      - 'RABBITMQ_DEFAULT_USER=myuser'
      - 'RABBITMQ_DEFAULT_PASS=secret'
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - 'rabbitmq_data:/var/lib/rabbitmq'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: 'docker.io/library/redis:alpine'
    container_name: ranchr-redis
    ports:
      - '6379:6379'
    volumes:
      - 'redis_data:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ranchr-app
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_PROFILES_ACTIVE=prod'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ranchr_db'
      - 'SPRING_DATASOURCE_USERNAME=Pass'
      - 'SPRING_DATASOURCE_PASSWORD=finance'
      - 'SPRING_DATA_REDIS_HOST=redis'
      - 'SPRING_DATA_REDIS_PORT=6379'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_PORT=5672'
      - 'SPRING_RABBITMQ_USERNAME=myuser'
      - 'SPRING_RABBITMQ_PASSWORD=secret'
      - 'SECURITY_JWT_SECRET_KEY=${JWT_SECRET_KEY:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}'
      - 'AFRICASTALKING_USERNAME=${AFRICASTALKING_USERNAME:-sandbox}'
      - 'AFRICASTALKING_API_KEY=${AFRICASTALKING_API_KEY:-dummy_key}'
      - 'AFRICASTALKING_SENDER_ID=${AFRICASTALKING_SENDER_ID:-RANCHR}'
      - 'APP_CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-dummy_cloud}'
      - 'APP_CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-dummy_key}'
      - 'APP_CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-dummy_secret}'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
